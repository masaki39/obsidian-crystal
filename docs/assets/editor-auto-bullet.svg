<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Auto bullet: a space at the start of a line becomes a bullet" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
  <style>@media (prefers-color-scheme: dark){.f1f2937{fill:#c0caf5} .f6b7280{fill:#9aa5ce} .f6d28d9{fill:#7aa2f7} .f7c3aed{fill:#7aa2f7} .fddd6fe{fill:#3b4261} .ff5f3ff{fill:#1f2335} .fffffff{fill:#1a1b26} .s7c3aed{stroke:#7aa2f7} .sc4b5fd{stroke:#3d59a1} .sddd6fe{stroke:#3b4261}}</style>
  <rect class="ff5f3ff sc4b5fd" x="1" y="1" width="638" height="198" rx="16" fill="#f2f5fc" stroke="#a4bdf2" stroke-width="2"/>
  <text class="f6d28d9" x="40" y="44" font-size="16" font-weight="600" fill="#3760bf">Type a space</text>
  <rect class="fffffff sddd6fe" x="40" y="62" width="230" height="96" rx="10" fill="#ffffff" stroke="#c8d6f5"/>
  <rect class="fddd6fe" x="58" y="96" width="14" height="24" rx="3" fill="#c8d6f5"/>
  <text class="f1f2937" x="80" y="115" font-size="20" fill="#343b58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">foo</text>
  <text class="f6b7280" x="58" y="146" font-size="12" fill="#6172b0">space at line start</text>
  <g transform="translate(292 110)"><path class="s7c3aed" d="M0 0 h56" stroke="#2e7de9" stroke-width="4" stroke-linecap="round"/><path class="s7c3aed" d="M44 -11 l13 11 -13 11" fill="none" stroke="#2e7de9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="f6d28d9" x="370" y="44" font-size="16" font-weight="600" fill="#3760bf">Get a bullet</text>
  <rect class="fffffff sddd6fe" x="370" y="62" width="230" height="96" rx="10" fill="#ffffff" stroke="#c8d6f5"/>
  <text class="f1f2937" x="388" y="115" font-size="20" fill="#343b58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan class="f7c3aed" fill="#2e7de9" font-weight="700">-</tspan> foo</text>
  <text class="f6b7280" x="388" y="146" font-size="12" fill="#6172b0">one undo away</text>
</svg>
